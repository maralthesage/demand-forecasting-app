version: '3.8'

services:
  demand-forecasting-app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - SALES_FORECAST_DATA_PATH=/app/data/sample
      - PYTHONPATH=/app
    volumes:
      # Optional: Mount local data directory if you want to use your own data
      # - ./data:/app/data
      # Mount cache and logs for persistence (optional)
      - ./cache:/app/cache
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s